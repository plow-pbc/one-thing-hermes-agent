services:
  agent:
    build: .
    environment:
      # The registered Agent Index id; without it the reporter stands down.
      AGENT_ID: ${AGENT_ID:-}
      # The daily text fires at 08:00 in this zone.
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      # `.host`, not the path the agent reads: the image copies it into place as root.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home: its goal, its memory, its sessions. `down -v` starts fresh.
      - agent-home:/var/lib/hermes
    # The agent checkpoints its session on SIGTERM within 30s.
    stop_grace_period: 35s

volumes:
  agent-home:
